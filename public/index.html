<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b1d3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ledger" />
  <title>Ledger</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" defer></script>
  <script src="/vendor/simplewebauthn-browser.min.js" defer></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <!-- Sign in -->
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="logo">L</div>
      <h1>Ledger</h1>
      <p class="muted">Your money, with a plan.</p>
      <button type="button" class="btn primary block hidden" id="passkeyBtn">🔑 Sign in with passkey</button>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required />
      <button class="btn block" type="submit">Unlock with password</button>
      <p id="loginErr" class="error" role="alert"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="appbar">
      <div class="wrap appbar-inner">
        <a class="brand" href="#/today"><span class="logo sm">L</span> Ledger</a>
        <nav id="topnav" class="topnav" aria-label="Main"></nav>
        <div class="appbar-actions">
          <button class="icon-btn" data-action="sync" title="Sync now" aria-label="Sync now">↻</button>
          <button class="icon-btn" data-action="lock" title="Lock" aria-label="Lock">🔒</button>
        </div>
      </div>
    </header>
    <main id="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  </div>

  <div id="sheet" class="sheet hidden"></div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
